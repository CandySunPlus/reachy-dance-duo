[project]
name = "reachy-dance-duo-analyzer"
version = "0.1.0"
description = "QQ Music + librosa analyzer backend for the Reachy Dance Duo JS app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "librosa>=0.10.2",
    "av>=13.1",
    "numpy>=1.26,<2",
    "pydantic>=2.9",
    "httpx>=0.27",
    "qqmusic-api-python>=0.8.2,<0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
